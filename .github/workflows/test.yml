name: CI Joyeria Rodriguez

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # O la versión que uses en tu servidor

      - name: Verificar sintaxis PHP (Linter)
        run: |
          # Esto analiza todos tus archivos PHP en busca de errores fatales de sintaxis
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;